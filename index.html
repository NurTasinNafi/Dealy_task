<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ দিনের ডায়নামিক স্টাডি রুটিন</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .backup-section {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 25px;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .day-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .day-header {
            background-color: #f3f4f6;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-list {
            padding: 15px 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #f0f0f0;
        }

        .task-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        label {
            cursor: pointer;
            font-size: 15px;
            flex-grow: 1;
            transition: color 0.2s;
        }

        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>১০ দিনের স্টাডি রুটিন</h1>
    <div class="subtitle">প্রতিদিন ১ ঘণ্টা করে ৪টি বিষয়ের রিভিশন প্ল্যান</div>

    <!-- ব্যাকআপ এবং ডাটা রিকভারি সেকশন -->
    <div class="backup-section">
        <button onclick="exportJSON()">JSON ব্যাকআপ ডাউনলোড</button>
        <button onclick="document.getElementById('importFile').click()">JSON ইমপোর্ট করুন</button>
        <input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importJSON(this)">
        <button class="btn-danger" onclick="resetRoutine()">রিসেট করুন</button>
    </div>

    <!-- রুটিন কন্টেইনার -->
    <div id="routine-container"></div>
</div>

<script>
    // ১০ দিনের রুটিন ডাটা অবজেক্ট
    const routineData = [
        { day: 1, tasks: ["Physics: অধ্যায় ১, ২", "Math: অধ্যায় ১, ২", "Social Science: অধ্যায় ১", "Python: অধ্যায় ১, ২"] },
        { day: 2, tasks: ["Physics: অধ্যায় ৩, ৪", "Math: অধ্যায় ৩, ৪", "Social Science: অধ্যায় ২, ৩", "Python: অধ্যায় ৩, ৪"] },
        { day: 3, tasks: ["Physics: অধ্যায় ৫", "Math: অধ্যায় ৫, ৬", "Social Science: অধ্যায় ৪", "Python: অধ্যায় ৫"] },
        { day: 4, tasks: ["Physics: অধ্যায় ৬", "Math: অধ্যায় ৭, ৮", "Social Science: অধ্যায় ৫", "Python: অধ্যায় ৬"] },
        { day: 5, tasks: ["Physics: অধ্যায় ৭", "Math: অধ্যায় ৯", "Social Science: অধ্যায় ৬", "Python: অধ্যায় ७"] },
        { day: 6, tasks: ["Physics: অধ্যায় ৮", "Math: অধ্যায় ১০", "Social Science: অধ্যায় ৭", "Python: অধ্যায় ৮"] },
        { day: 7, tasks: ["Physics: অধ্যায় ৯", "Math: অধ্যায় ১১", "Social Science: অধ্যায় ৮", "Python: অধ্যায় ৯"] },
        { day: 8, tasks: ["Physics: অধ্যায় ১০", "Math: অধ্যায় ১২", "Social Science: অধ্যায় ৯", "Python: অধ্যায় ১০"] },
        { day: 9, tasks: ["Physics: অধ্যায় ১১", "Math: অধ্যায় ১৩", "Social Science: অধ্যায় ১০", "Python: অধ্যায় ১১"] },
        { day: 10, tasks: ["Physics: অধ্যায় ১২", "Math: অধ্যায় ১৪", "Social Science: রিভিশন", "Python: অধ্যায় ১২"] }
    ];

    const container = document.getElementById('routine-container');

    // রুটিন ইন্টারফেস তৈরি করার ফাংশন
    function renderRoutine() {
        container.innerHTML = '';
        
        routineData.forEach((dayData) => {
            const dayCard = document.createElement('div');
            dayCard.className = 'day-card';

            const dayHeader = document.createElement('div');
            dayHeader.className = 'day-header';
            dayHeader.innerHTML = `<span>দিন ০${dayData.day}</span>`;
            dayCard.appendChild(dayHeader);

            const taskList = document.createElement('div');
            taskList.className = 'task-list';

            dayData.tasks.forEach((task, index) => {
                const taskId = `day-${dayData.day}-task-${index}`;
                const isChecked = localStorage.getItem(taskId) === 'true' ? 'checked' : '';

                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                taskItem.innerHTML = `
                    <input type="checkbox" id="${taskId}" ${isChecked} onchange="saveState('${taskId}', this.checked)">
                    <label for="${taskId}">${task}</label>
                `;
                taskList.appendChild(taskItem);
            });

            dayCard.appendChild(taskList);
            container.appendChild(dayCard);
        });
    }

    // লোকাল মেমরিতে প্রোগ্রেস সেভ করা
    function saveState(id, isChecked) {
        localStorage.setItem(id, isChecked);
    }

    // প্রোগ্রেস সম্পূর্ণ রিসেট করা
    function resetRoutine() {
        if (confirm("আপনি কি নিশ্চিত যে আপনার সমস্ত প্রোগ্রেস মুছে ফেলতে চান?")) {
            localStorage.clear();
            renderRoutine();
        }
    }

    // JSON ফাইল এক্সপোর্ট (ডাউনলোড) করার ফাংশন
    function exportJSON() {
        const state = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            state[key] = localStorage.getItem(key);
        }
        
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "study_routine_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // JSON ফাইল ইমপোর্ট (আপলোড) করার ফাংশন
    function importJSON(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                localStorage.clear();
                for (const key in importedData) {
                    localStorage.setItem(key, importedData[key]);
                }
                renderRoutine();
                alert("ব্যাকআপ সফলভাবে ইমপোর্ট করা হয়েছে!");
            } catch (error) {
                alert("ভুল JSON ফাইল! অনুগ্রহ করে সঠিক ফাইলটি সিলেক্ট করুন।");
            }
        };
        reader.readAsText(file);
        input.value = ''; // রিসেট ফাইল ইনপুট
    }

    // প্রথমবার পেজ লোড হলে রুটিন রেন্ডার করা
    renderRoutine();
</script>

</body>
</html>
